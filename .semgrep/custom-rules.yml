rules:
  - id: hardcoded-django-secret-key
    languages: [python]
    severity: ERROR
    message: >-
      SECRET_KEY захардкоджено у коді. Винесіть його у змінну середовища
      (os.environ["DJANGO_SECRET_KEY"]) або в менеджер секретів.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern: SECRET_KEY = "..."

  - id: debug-enabled
    languages: [python]
    severity: WARNING
    message: >-
      DEBUG = True розкриває стек-трейси та налаштування. Керуйте ним через
      змінну середовища і вимикайте в продакшені.
    metadata:
      cwe: "CWE-489: Active Debug Code"
    pattern: DEBUG = True

  - id: credentials-in-url
    languages: [python]
    severity: ERROR
    message: >-
      Логін і пароль вшиті в URL (http://user:pass@host). Облікові дані
      потрапляють у логи, БД та історію Git.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
    patterns:
      - pattern-either:
          - pattern: '"$URL"'
          - pattern: f"$URL"
      - metavariable-regex:
          metavariable: $URL
          regex: '(?i)https?://[^/\s:@{}]+:[^/\s@{}]+@'
