---
- name: Відновлення застосунку demo з резервної копії
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "kubectl --kubeconfig {{ kubeconfig_path }}"
    source_backup: lab9-initial
    restore_name: "lab9-restore-{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"
  tasks:
    - name: Дата створення даних у томі до видалення
      ansible.builtin.command: "{{ kubectl }} -n demo exec deploy/web -c nginx -- cat /data/created.txt"
      register: before
      changed_when: false

    - name: Видалити простір імен demo (імітація аварії)
      ansible.builtin.command: "{{ kubectl }} delete namespace demo --wait=true --timeout=300s"
      changed_when: true

    - name: Створити Restore
      ansible.builtin.shell: |
        set -o pipefail
        cat <<EOF | {{ kubectl }} create -f -
        apiVersion: velero.io/v1
        kind: Restore
        metadata:
          name: {{ restore_name }}
          namespace: velero
        spec:
          backupName: {{ source_backup }}
          includedNamespaces: [demo]
          restorePVs: true
        EOF
      args:
        executable: /bin/bash
      changed_when: true

    - name: Дочекатися завершення відновлення
      ansible.builtin.command: "{{ kubectl }} -n velero get restore {{ restore_name }} -o jsonpath={.status.phase}"
      register: restore_phase
      until: restore_phase.stdout in ['Completed', 'PartiallyFailed', 'Failed']
      retries: 60
      delay: 10
      changed_when: false
      failed_when: restore_phase.stdout != 'Completed'

    - name: Застосунок знову працює
      ansible.builtin.command: "{{ kubectl }} -n demo rollout status deploy/web --timeout=300s"
      changed_when: false

    - name: Дані в томі після відновлення
      ansible.builtin.command: "{{ kubectl }} -n demo exec deploy/web -c nginx -- cat /data/created.txt"
      register: after
      changed_when: false
      failed_when: after.stdout != before.stdout

    - name: Результат
      ansible.builtin.debug:
        msg: "Дані відновлено: {{ before.stdout }} == {{ after.stdout }}"
