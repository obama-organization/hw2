---
- name: Дочекатися завершення cloud-init (apt може бути зайнятий)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Базові пакети безпеки
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - auditd
      - qemu-guest-agent
      - ca-certificates
      - curl
      - jq
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: qemu-guest-agent увімкнено
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: SSH — лише ключі, без root, обмежена кількість спроб
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Параметри ядра (sysctl)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"

- name: Автоматичні оновлення безпеки
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: fail2ban для sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  notify: Restart fail2ban

- name: Swap-файл (ВМ має лише 2 ГБ RAM)
  when: mon_swap_mb | int > 0
  block:
    - name: Створити /swapfile
      ansible.builtin.command: "fallocate -l {{ mon_swap_mb }}M /swapfile"
      args:
        creates: /swapfile
      register: swapfile

    - name: Підготувати swap
      ansible.builtin.shell: chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
      when: swapfile is changed
      changed_when: true

    - name: Swap у fstab
      ansible.posix.mount:
        src: /swapfile
        path: none
        fstype: swap
        opts: sw
        state: present

- name: UFW — заборонити все вхідне за замовчуванням
  community.general.ufw:
    direction: incoming
    default: deny

- name: UFW — дозволити вихідне
  community.general.ufw:
    direction: outgoing
    default: allow

- name: UFW — дозволені порти з LAN лабораторії і VPN
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item.0 }}"
    to_port: "{{ item.1 | string }}"
    comment: lab9
  loop: "{{ admin_cidrs | product(ufw_allowed_tcp_ports) | list }}"

- name: UFW увімкнено
  community.general.ufw:
    state: enabled
    logging: "low"
