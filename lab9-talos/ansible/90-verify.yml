---
- name: Перевірка логів, метрик, Falco і доставки алертів
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "kubectl --kubeconfig {{ kubeconfig_path }}"
    loki: "http://{{ mon_ip }}:{{ port_loki }}"
    prom: "http://{{ mon_ip }}:{{ port_prometheus }}"
    am: "http://{{ mon_ip }}:{{ port_alertmanager }}"
    cleanup: true
  tasks:
    - name: Логи Talos (сервіси і ядро) є в Loki
      ansible.builtin.uri:
        url: "{{ loki }}/loki/api/v1/query?query={{ 'sum by (node, stream) (count_over_time({job=\"talos\"}[15m]))' | urlencode }}"
        return_content: true
      register: talos_logs
      until: talos_logs.json.data.result | length > 0
      retries: 20
      delay: 15

    - name: Потоки логів Talos
      ansible.builtin.debug:
        msg: "{{ talos_logs.json.data.result | map(attribute='metric') | list }}"

    - name: Цілі Prometheus, що не відповідають
      ansible.builtin.uri:
        url: "{{ prom }}/api/v1/query?query={{ 'up == 0' | urlencode }}"
        return_content: true
      register: down_targets

    - name: Показати недоступні цілі (має бути порожньо)
      ansible.builtin.debug:
        msg: "{{ down_targets.json.data.result | map(attribute='metric') | list }}"

    - name: Метрики Talos (node-exporter, etcd) і kube-state-metrics збираються
      ansible.builtin.uri:
        url: "{{ prom }}/api/v1/query?query={{ ('count by (job) (up{job=~\"talos-node-exporter|talos-etcd|kube-state-metrics\"} == 1)') | urlencode }}"
        return_content: true
      register: key_targets
      failed_when: key_targets.json.data.result | length < 3

    - name: Под, що постійно падає (тест алерту)
      ansible.builtin.shell: |
        set -o pipefail
        cat <<'EOF' | {{ kubectl }} apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: alert-test-crashloop
          namespace: demo
          labels: { purpose: alert-test }
        spec:
          restartPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: crash
              image: busybox:1.37
              command: ["sh", "-c", "echo 'lab9: навмисна помилка для перевірки алертів'; sleep 5; exit 1"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                limits: { memory: 16Mi, cpu: 50m }
        EOF
      args:
        executable: /bin/bash
      changed_when: true

    - name: Тестовий под для Falco
      ansible.builtin.command: >-
        {{ kubectl }} -n default run falco-test --image=alpine:3.22 --restart=Never
        --labels=purpose=falco-test -- sleep 900
      register: falco_pod
      changed_when: falco_pod.rc == 0
      failed_when: falco_pod.rc != 0 and 'AlreadyExists' not in falco_pod.stderr

    - name: Под falco-test запущено
      ansible.builtin.command: "{{ kubectl }} -n default wait pod/falco-test --for=condition=Ready --timeout=180s"
      changed_when: false

    - name: Читання /etc/shadow і запис у /etc у контейнері (правила Falco)
      ansible.builtin.command: "{{ kubectl }} -n default exec falco-test -- sh -c 'cat /etc/shadow >/dev/null; echo lab9 >> /etc/lab9-falco-test'"
      changed_when: true

    - name: Події Falco в Loki
      ansible.builtin.uri:
        url: "{{ loki }}/loki/api/v1/query?query={{ 'sum by (rule, priority) (count_over_time({rule=~\".+\"}[15m]))' | urlencode }}"
        return_content: true
      register: falco_events
      until: falco_events.json.data.result | length > 0
      retries: 20
      delay: 10

    - name: Показати події Falco
      ansible.builtin.debug:
        msg: "{{ falco_events.json.data.result | map(attribute='metric') | list }}"

    - name: Алерт від Falco в Alertmanager
      ansible.builtin.uri:
        url: "{{ am }}/api/v2/alerts?filter={{ 'source=\"falco\"' | urlencode }}"
        return_content: true
      register: falco_alerts
      until: falco_alerts.json | length > 0
      retries: 20
      delay: 10

    - name: KubePodCrashLooping спрацював у Prometheus/Alertmanager (до ~6 хв)
      ansible.builtin.uri:
        url: "{{ am }}/api/v2/alerts?filter={{ 'alertname=\"KubePodCrashLooping\"' | urlencode }}"
        return_content: true
      register: crash_alert
      until: crash_alert.json | length > 0
      retries: 48
      delay: 15

    - name: Сповіщення доставлено (webhook -> Vector -> Loki)
      ansible.builtin.uri:
        url: "{{ loki }}/loki/api/v1/query?query={{ 'sum by (alertname, status) (count_over_time({job=\"alertmanager\"}[30m]))' | urlencode }}"
        return_content: true
      register: delivered
      until: delivered.json.data.result | selectattr('metric.alertname', 'equalto', 'KubePodCrashLooping') | list | length > 0
      retries: 20
      delay: 15

    - name: Доставлені сповіщення
      ansible.builtin.debug:
        msg: "{{ delivered.json.data.result | map(attribute='metric') | list }}"

    - name: Прибрати тестові поди
      ansible.builtin.command: "{{ kubectl }} delete pod {{ item }} --ignore-not-found --wait=false"
      loop: ["-n demo alert-test-crashloop", "-n default falco-test"]
      when: cleanup | bool
      changed_when: true
