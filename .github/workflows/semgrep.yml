name: SAST (Semgrep)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install "semgrep==1.178.0"

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config .semgrep/ \
            --metrics=off \
            --json-output=semgrep.json \
            --sarif-output=semgrep.sarif

      - name: Summary and quality gate
        run: python .github/scripts/semgrep_summary.py semgrep.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: |
            semgrep.json
            semgrep.sarif
          retention-days: 14
