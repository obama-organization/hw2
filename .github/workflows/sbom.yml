name: SBOM and dependency scan (Syft + Grype)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Syft SBOM and Grype scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          config: .syft.yaml
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Scan SBOM with Grype (SARIF)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          output-format: sarif
          output-file: grype.sarif
          severity-cutoff: critical
          fail-build: false

      - name: Upload SARIF to GitHub Security
        if: github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: grype.sarif
          category: grype-sbom

      - name: Fail on CRITICAL vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          output-format: table
          severity-cutoff: critical
          fail-build: true
