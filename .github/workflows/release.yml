name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and sign release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create source archive
        run: git archive --format=tar.gz --prefix="hw2-${GITHUB_REF_NAME}/" -o "hw2-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          config: .syft.yaml
          output-file: hw2-${{ github.ref_name }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign release assets with Cosign (keyless)
        run: |
          for asset in "hw2-${GITHUB_REF_NAME}.tar.gz" "hw2-${GITHUB_REF_NAME}.sbom.cdx.json"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "hw2-${GITHUB_REF_NAME}.tar.gz" \
            "hw2-${GITHUB_REF_NAME}.tar.gz.sigstore.json" \
            "hw2-${GITHUB_REF_NAME}.sbom.cdx.json" \
            "hw2-${GITHUB_REF_NAME}.sbom.cdx.json.sigstore.json"
