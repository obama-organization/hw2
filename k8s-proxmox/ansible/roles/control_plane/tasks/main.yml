---
- name: Check whether the cluster is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Read kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: control_plane_kubeadm_version
  changed_when: false

- name: Write kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Initialize control plane
  ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
  when: not control_plane_admin_conf.stat.exists
  changed_when: true

- name: Disable leader election on the single control plane
  ansible.builtin.replace:
    path: "/etc/kubernetes/manifests/{{ item }}.yaml"
    regexp: '--leader-elect=true'
    replace: '--leader-elect=false'
  loop:
    - kube-controller-manager
    - kube-scheduler

- name: Create kubeconfig directory for admin user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install kubeconfig for admin user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Check whether Calico CRDs are installed
  ansible.builtin.command: kubectl get crd installations.operator.tigera.io
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico_crds
  changed_when: false
  failed_when: false

- name: Install Calico CRDs
  ansible.builtin.command: >-
    kubectl create -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/operator-crds.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: control_plane_calico_crds.rc != 0
  changed_when: true

- name: Check whether Calico operator is installed
  ansible.builtin.command: kubectl get deployment tigera-operator -n tigera-operator
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico_operator
  changed_when: false
  failed_when: false

- name: Install Calico operator
  ansible.builtin.command: >-
    kubectl create -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: control_plane_calico_operator.rc != 0
  changed_when: true

- name: Wait for Calico installation API
  ansible.builtin.command: kubectl wait --for=condition=established crd/installations.operator.tigera.io --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Write Calico installation
  ansible.builtin.template:
    src: calico-installation.yaml.j2
    dest: /etc/kubernetes/calico-installation.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply Calico installation
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/calico-installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_calico_apply
  changed_when: "'unchanged' not in control_plane_calico_apply.stdout"

- name: Copy baseline security manifests
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k8s/base/"
    dest: /etc/kubernetes/study7-base/
    owner: root
    group: root
    mode: "0600"
    directory_mode: "0700"

- name: Apply baseline security manifests
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/study7-base/
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: control_plane_base_apply
  changed_when: "'created' in control_plane_base_apply.stdout or 'configured' in control_plane_base_apply.stdout"

- name: Wait for control plane node to be ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ inventory_hostname | lower }} --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
