---
- name: Restart loki
  ansible.builtin.command: docker compose -f {{ obs_dir }}/compose.yml restart loki
  changed_when: true

- name: Restart vector
  ansible.builtin.command: docker compose -f {{ obs_dir }}/compose.yml restart vector
  changed_when: true

- name: Reload prometheus
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ port_prometheus }}/-/reload"
    method: POST
  register: prom_reload
  until: prom_reload.status == 200
  retries: 10
  delay: 3

- name: Reload alertmanager
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ port_alertmanager }}/-/reload"
    method: POST
  register: am_reload
  until: am_reload.status == 200
  retries: 10
  delay: 3

- name: Restart grafana
  ansible.builtin.command: docker compose -f {{ obs_dir }}/compose.yml restart grafana
  changed_when: true

- name: Restart seaweedfs
  ansible.builtin.command: docker compose -f {{ obs_dir }}/compose.yml restart seaweedfs
  changed_when: true
