groups:
  - name: kubernetes-state
    rules:
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Вузол {{ $labels.node }} у стані NotReady"
          description: "kube-state-metrics: вузол не Ready понад 2 хвилини."

      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CrashLoopBackOff: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Контейнер {{ $labels.container }} постійно перезапускається."

      - alert: KubePodNotReady
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Под {{ $labels.namespace }}/{{ $labels.pod }} не запущений"
          description: "Под у фазі Pending/Unknown/Failed понад 10 хвилин."

      - alert: KubeDeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }}: не всі репліки доступні"
          description: "Очікується {{ $value }} доступних реплік."

      - alert: KubeContainerOOMKilled
        expr: |
          (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
            and on (namespace, pod, container)
          (increase(kube_pod_container_status_restarts_total[10m]) > 0)
        labels:
          severity: warning
        annotations:
          summary: "OOMKilled: {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Контейнер {{ $labels.container }} перевищив ліміт пам'яті."

  - name: kubernetes-security
    rules:
      - alert: KubeAPIAuthErrorsSpike
        expr: sum(rate(apiserver_request_total{code=~"401|403"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Сплеск помилок 401/403 на API Server"
          description: "{{ $value | printf \"%.1f\" }} відмов автентифікації/авторизації на секунду."

  - name: backup
    rules:
      - alert: VeleroBackupFailed
        expr: increase(velero_backup_failure_total[1h]) > 0 or increase(velero_backup_partial_failure_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Резервна копія Velero завершилась з помилкою"
          description: "Розклад {{ $labels.schedule }}: є невдалі або частково невдалі бекапи за останню годину."

      - alert: VeleroNoRecentBackup
        expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 90000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Немає свіжого бекапу за розкладом {{ $labels.schedule }}"
          description: "Останній успішний бекап був понад 25 годин тому."
