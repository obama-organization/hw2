---
- name: Перевірка робочого місця і доступності ВМ
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Потрібні утиліти встановлені
      ansible.builtin.command: "which {{ item }}"
      changed_when: false
      loop: [talosctl, kubectl, helm]

    - name: Каталоги для стану і секретів (поза Git)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: ["{{ state_dir }}", "{{ talos_dir }}", "{{ secrets_dir }}"]

    - name: ВМ моніторингу відповідає по SSH
      ansible.builtin.wait_for:
        host: "{{ mon_ip }}"
        port: 22
        timeout: 600

    - name: Вузли Talos відповідають на порту apid (50000)
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 50000
        timeout: 900
      loop: "{{ talos_all_ips }}"
